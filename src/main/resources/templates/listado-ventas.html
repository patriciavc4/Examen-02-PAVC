<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Farmacia | Ventas</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css}">
    <link rel="stylesheet" th:href="@{/plugins/datatables-responsive/css/responsive.bootstrap4.min.css}">
    <link rel="stylesheet" th:href="@{/plugins/datatables-buttons/css/buttons.bootstrap4.min.css}">
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">

    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
            <li class="nav-item d-none d-sm-inline-block">
            </li>
        </ul>
    </nav>

    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a th:href="@{/inicio}" class="brand-link">
            <img th:src="@{/dist/img/drugstore_4320337.png}" alt="Logo Farmacia" class="brand-image">
            <span class="brand-text font-weight-light">Farmacia</span>
        </a>

        <div class="sidebar">
            <div class="user-panel mt-3 pb-3 mb-3 d-flex">
                <div class="image">
                    <img th:src="@{/dist/img/usuario.jpeg}" class="img-circle elevation-2" alt="User Image">
                </div>
                <div class="text-left mr-auto" th:if="${session.usuario != null}">
                    <div class="info">
                        <a href="#" class="d-block">
                            <span th:text="${session.usuario.nombre}">Usuario</span>
                        </a>
                    </div>
                </div>
            </div>

            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">

                    <li class="nav-item">
                        <a th:href="@{/inicio}" class="nav-link">
                            <i class="nav-icon fas fa-home"></i>
                            <p>Inicio</p>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a th:href="@{/medicamentos}" class="nav-link">
                            <i class="nav-icon fas fa-pills"></i>
                            <p>Medicamentos</p>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a th:href="@{/ventas}" class="nav-link active">
                            <i class="nav-icon fas fa-shopping-cart"></i>
                            <p>Ventas</p>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a th:href="@{/facturacion}" class="nav-link">
                            <i class="nav-icon fas fa-file-invoice-dollar"></i>
                            <p>Facturación</p>
                        </a>
                    </li>

                    <li class="nav-header">CUENTA</li>

                    <li class="nav-item">
                        <a th:href="@{/auth/logout}" class="nav-link">
                            <i class="nav-icon fas fa-sign-out-alt text-danger"></i>
                            <p>Salir</p>
                        </a>
                    </li>

                </ul>
            </nav>
        </div>
    </aside>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1>Ventas</h1>
                    </div>
                </div>
            </div>
        </section>

        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">

                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Listado general de ventas registradas</h3>
                                <div class="card-tools">
                                    <a th:href="@{/ventas/nueva}" class="btn btn-primary btn-sm">
                                        <i class="fas fa-plus"></i> Registrar Venta
                                    </a>
                                </div>
                            </div>
                            <div class="card-body">
                                <table id="tablaVentas" class="table table-bordered table-striped">
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Cliente</th>
                                        <th>Fecha</th>
                                        <th>Total</th>
                                        <th>Acciones</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="venta : ${ventas}">
                                        <td th:text="${venta.idVenta}"></td>
                                        <td th:text="${venta.nombreCliente}"></td>
                                        <td th:text="${#dates.format(venta.fechaVenta, 'dd/MM/yyyy')}"></td>
                                        <td th:text="'$' + ${#numbers.formatDecimal(venta.total, 1, 'COMMA', 2, 'POINT')}"></td>
                                        <td>
                                            <a th:href="@{/ventas/detalles/{id}(id=${venta.idVenta})}" class="btn btn-sm btn-success">
                                                <i class="fas fa-list"></i> Detalles
                                            </a>
                                            <a th:href="@{/ventas/actualizar/{id}(id=${venta.idVenta})}" class="btn btn-sm btn-info">
                                                <i class="fas fa-edit"></i> Editar
                                            </a>
                                            <a th:href="@{/ventas/eliminar/{id}(id=${venta.idVenta})}" class="btn btn-sm btn-danger">
                                                <i class="fas fa-trash"></i> Eliminar
                                            </a>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

</div>
<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/plugins/datatables/jquery.dataTables.min.js}"></script>
<script th:src="@{/plugins/datatables-bs4/js/dataTables.bootstrap4.min.js}"></script>
<script th:src="@{/plugins/datatables-responsive/js/dataTables.responsive.min.js}"></script>
<script th:src="@{/plugins/datatables-responsive/js/responsive.bootstrap4.min.js}"></script>
<script th:src="@{/dist/js/adminlte.min.js}"></script>

<script>
    $(function () {
        $('#tablaVentas').DataTable({
            "paging": true,
            "lengthChange": false,
            "searching": false,
            "ordering": true,
            "info": true,
            "autoWidth": false,
            "responsive": true,
            "language": {
                "url": "https://cdn.datatables.net/plug-ins/1.10.25/i18n/Spanish.json"
            }
        });
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalles de Venta</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="/plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css">
    <link rel="stylesheet" href="/dist/css/adminlte.min.css">
</head>
<body class="hold-transition">
<div class="container-fluid p-4">
    <div class="row justify-content-center">
        <div class="col-md-10">

            <div class="card card-success">
                <div class="card-header">
                    <h3 class="card-title">
                        Detalles de Venta #<span th:text="${venta.idVenta}"></span>
                        — <span th:text="${venta.nombreCliente}"></span>
                    </h3>
                    <div class="card-tools">
                        <a th:href="@{/ventas/detalles/nuevo/{id}(id=${venta.idVenta})}" class="btn btn-primary btn-sm">
                            <i class="fas fa-plus"></i> Agregar Detalle
                        </a>
                    </div>
                </div>

                <div class="card-body">
                    <table id="tablaDetalles" class="table table-bordered table-striped">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Medicamento</th>
                            <th>Precio Unitario</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="detalle : ${detalles}">
                            <td th:text="${detalle.idDetalle}"></td>
                            <td th:text="${detalle.medicamento.nombre}"></td>
                            <td th:text="'$' + ${#numbers.formatDecimal(detalle.medicamento.precio, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${detalle.cantidad}"></td>
                            <td th:text="'$' + ${#numbers.formatDecimal(detalle.subtotal, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td>
                                <a th:href="@{/ventas/detalles/actualizar/{id}(id=${detalle.idDetalle})}" class="btn btn-sm btn-info">
                                    <i class="fas fa-edit"></i> Editar
                                </a>
                                <a th:href="@{/ventas/detalles/eliminar/{id}(id=${detalle.idDetalle})}" class="btn btn-sm btn-danger">
                                    <i class="fas fa-trash"></i> Eliminar
                                </a>
                            </td>
                        </tr>
                        </tbody>
                        <tfoot>
                        <tr>
                            <td colspan="4" class="text-right"><strong>Total:</strong></td>
                            <td th:text="'$' + ${#numbers.formatDecimal(venta.total, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td></td>
                        </tr>
                        </tfoot>
                    </table>
                </div>

                <div class="card-footer">
                    <a th:href="@{/ventas}" class="btn btn-default">
                        <i class="fas fa-arrow-left"></i> Volver a Ventas
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="/plugins/jquery/jquery.min.js"></script>
<script src="/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/plugins/datatables/jquery.dataTables.min.js"></script>
<script src="/plugins/datatables-bs4/js/dataTables.bootstrap4.min.js"></script>
<script src="/dist/js/adminlte.min.js"></script>
<script>
    $(function () {
        $('#tablaDetalles').DataTable({
            "paging": false,
            "searching": false,
            "ordering": true,
            "info": false,
            "language": {
                "url": "https://cdn.datatables.net/plug-ins/1.10.25/i18n/Spanish.json"
            }
        });
    });
</script>
</body>
</html>
